<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2129">
<title>Inspección de Aeronave</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#1B2129;
    --surface:#232A34;
    --surface-2:#2B333F;
    --rule:#3A4250;
    --text:#EDEFF2;
    --muted:#8B95A3;
    --amber:#F2A20C;
    --amber-dim:#5C4415;
    --green:#3FA672;
    --red:#E5484D;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:48px;
  }
  header{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--rule);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  header h1{
    font-size:17px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }
  header .next-item{
    font-family:var(--mono);
    font-size:13px;
    color:var(--amber);
  }
  main{
    max-width:520px;
    margin:0 auto;
    padding:20px 20px 0;
  }
  .section{
    margin-bottom:28px;
  }
  .section-label{
    font-size:12px;
    color:var(--muted);
    margin-bottom:10px;
    font-weight:600;
  }
  .photo-box{
    background:var(--surface);
    border:1px dashed var(--rule);
    border-radius:6px;
    min-height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    cursor:pointer;
  }
  .photo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    position:absolute;
    inset:0;
  }
  .photo-box .placeholder{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:20px;
  }
  .photo-box .placeholder .icon{
    font-size:28px;
    display:block;
    margin-bottom:8px;
  }
  input[type=file]{display:none;}
  label.field-label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field{
    margin-bottom:16px;
  }
  input[type=text], select, textarea{
    width:100%;
    background:var(--surface);
    border:1px solid var(--rule);
    color:var(--text);
    padding:12px;
    border-radius:6px;
    font-size:15px;
    font-family:var(--sans);
  }
  input[type=text]:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--amber);
  }
  textarea{
    min-height:80px;
    resize:vertical;
  }
  select{
    appearance:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%238B95A3"/></svg>');
    background-repeat:no-repeat;
    background-position:right 14px center;
  }
  .translate-row{
    display:flex;
    gap:10px;
    align-items:center;
    margin:6px 0 10px;
  }
  .btn{
    border:none;
    border-radius:6px;
    padding:12px 18px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:var(--sans);
  }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--text);
  }
  .btn-ghost:hover{border-color:var(--amber);}
  .btn-primary{
    background:var(--amber);
    color:#1B2129;
    width:100%;
    padding:15px;
    font-size:15px;
  }
  .btn-primary:disabled{
    background:var(--surface-2);
    color:var(--muted);
    cursor:not-allowed;
  }
  .en-box{
    background:var(--surface-2);
    border-left:2px solid var(--amber);
    border-radius:0 6px 6px 0;
    padding:12px;
    font-size:14px;
    color:var(--text);
    display:none;
  }
  .en-box.show{display:block;}
  .en-box textarea{
    background:transparent;
    border:none;
    padding:0;
    min-height:50px;
  }
  .status-msg{
    font-size:13px;
    padding:12px;
    border-radius:6px;
    margin-bottom:16px;
    display:none;
  }
  .status-msg.show{display:block;}
  .status-msg.ok{background:rgba(63,166,114,0.12); color:var(--green); border:1px solid rgba(63,166,114,0.3);}
  .status-msg.err{background:rgba(229,72,77,0.12); color:var(--red); border:1px solid rgba(229,72,77,0.3);}
  .status-msg.info{background:rgba(242,162,12,0.1); color:var(--amber); border:1px solid rgba(242,162,12,0.25);}
  .item-code{
    font-family:var(--mono);
    font-weight:700;
  }
  .config-note{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }
  .footer-space{height:20px;}
</style>
</head>
<body>

<header>
  <h1>Inspección de aeronave</h1>
  <span class="next-item" id="nextItemLabel">preparando…</span>
</header>

<main>

  <div id="statusMsg" class="status-msg"></div>

  <div class="section">
    <div class="section-label">FOTOGRAFÍA</div>
    <div class="photo-box" id="photoBox">
      <div class="placeholder" id="photoPlaceholder">
        <span class="icon">📷</span>
        Toca para sacar la foto
      </div>
      <img id="photoPreview" style="display:none;">
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment">
  </div>

  <div class="section">
    <div class="section-label">DATOS DE LA INSPECCIÓN</div>

    <div class="field">
      <label class="field-label" for="ata">ATA</label>
      <input type="text" id="ata" placeholder="Ej: 32" list="ataList" inputmode="numeric">
      <datalist id="ataList">
        <option value="05">05 - Mantenimiento periódico</option>
        <option value="21">21 - Aire acondicionado</option>
        <option value="27">27 - Mandos de vuelo</option>
        <option value="32">32 - Tren de aterrizaje</option>
        <option value="52">52 - Puertas</option>
        <option value="53">53 - Fuselaje</option>
        <option value="57">57 - Alas</option>
        <option value="71">71 - Motores</option>
      </datalist>
    </div>

    <div class="field">
      <label class="field-label" for="area">Área</label>
      <select id="area">
        <option value="">Selecciona…</option>
        <option>Fuselaje</option>
        <option>Cabina</option>
        <option>Trenes de aterrizaje</option>
        <option>Alas</option>
        <option>Empenaje</option>
        <option>Motores</option>
        <option>Compartimento de carga</option>
        <option>Otro</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label" for="subarea">Subárea</label>
      <input type="text" id="subarea" placeholder="Ej: lado técnico">
    </div>

    <div class="field">
      <label class="field-label" for="descripcion">Descripción</label>
      <textarea id="descripcion" placeholder="Describe el hallazgo…"></textarea>
    </div>

    <div class="field">
      <label class="field-label" for="responsable">Responsable</label>
      <input type="text" id="responsable" placeholder="Nombre del inspector">
    </div>
  </div>

  <div class="section">
    <div class="section-label">TRADUCCIÓN</div>
    <div class="translate-row">
      <button class="btn btn-ghost" id="translateBtn">Traducir a inglés</button>
    </div>
    <div class="en-box" id="enBox">
      <textarea id="descripcionEn" placeholder="Traducción (editable)"></textarea>
    </div>
  </div>

  <div class="section">
    <button class="btn btn-primary" id="submitBtn">Guardar item</button>
    <div class="config-note">Se guardará como <span id="willBeLabel" class="item-code">item 000</span></div>
  </div>

  <div class="footer-space"></div>
</main>

<script>
// ============================================================
// CONFIGURACIÓN — pega aquí la URL de tu Apps Script desplegado
// ============================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwVuLxXgBQDHmyaJw0Zv0dtHiYyeJUB--UR5oasz5YH_kYKXRkzIh7LBIGf0MZ7QOQyMA/exec';

let photoBase64 = null;
let translatedText = '';

const photoBox = document.getElementById('photoBox');
const photoInput = document.getElementById('photoInput');
const photoPreview = document.getElementById('photoPreview');
const photoPlaceholder = document.getElementById('photoPlaceholder');
const statusMsg = document.getElementById('statusMsg');
const translateBtn = document.getElementById('translateBtn');
const enBox = document.getElementById('enBox');
const descripcionEn = document.getElementById('descripcionEn');
const submitBtn = document.getElementById('submitBtn');

photoBox.addEventListener('click', () => photoInput.click());

photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    photoBase64 = ev.target.result;
    photoPreview.src = photoBase64;
    photoPreview.style.display = 'block';
    photoPlaceholder.style.display = 'none';
  };
  reader.readAsDataURL(file);
});

function showStatus(text, type) {
  statusMsg.textContent = text;
  statusMsg.className = 'status-msg show ' + type;
}
function hideStatus() {
  statusMsg.className = 'status-msg';
}

// Traducción gratuita vía MyMemory (sin API key, límite ~5000 palabras/día por IP)
translateBtn.addEventListener('click', async () => {
  const text = document.getElementById('descripcion').value.trim();
  if (!text) {
    showStatus('Escribe primero la descripción.', 'err');
    return;
  }
  translateBtn.textContent = 'Traduciendo…';
  translateBtn.disabled = true;
  try {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=es|en';
    const res = await fetch(url);
    const data = await res.json();
    const translated = data && data.responseData ? data.responseData.translatedText : '';
    descripcionEn.value = translated || '';
    enBox.classList.add('show');
    hideStatus();
  } catch (err) {
    showStatus('No se pudo traducir (revisa la conexión). Puedes escribirla a mano abajo.', 'err');
    enBox.classList.add('show');
  } finally {
    translateBtn.textContent = 'Traducir a inglés';
    translateBtn.disabled = false;
  }
});

submitBtn.addEventListener('click', async () => {
  const ata = document.getElementById('ata').value.trim();
  const area = document.getElementById('area').value;
  const subarea = document.getElementById('subarea').value.trim();
  const descripcion = document.getElementById('descripcion').value.trim();
  const responsable = document.getElementById('responsable').value.trim();

  if (!photoBase64) { showStatus('Falta la foto.', 'err'); return; }
  if (!ata || !area || !descripcion || !responsable) {
    showStatus('Rellena ATA, área, descripción y responsable.', 'err');
    return;
  }
  if (APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === 0 || APPS_SCRIPT_URL.includes('PEGA_AQUI')) {
    showStatus('Falta configurar la URL de Apps Script en el código (ver guía).', 'err');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Guardando…';
  showStatus('Guardando en Google Drive…', 'info');

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
      body: JSON.stringify({
        action: 'submitItem',
        ata, area, subarea,
        descripcion,
        descripcionEn: descripcionEn.value.trim(),
        responsable,
        photoBase64
      })
    });
    const data = await res.json();
    if (data.ok) {
      showStatus('Guardado como ' + data.itemNumber + '. Carpeta creada en Drive.', 'ok');
      resetForm();
      fetchNextItemPreview();
    } else {
      showStatus('Error: ' + (data.error || 'desconocido'), 'err');
    }
  } catch (err) {
    showStatus('No se pudo conectar con el servidor. Revisa tu conexión y vuelve a intentarlo — tus datos no se han perdido, pulsa "Guardar item" otra vez.', 'err');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Guardar item';
  }
});

function resetForm() {
  photoBase64 = null;
  photoPreview.style.display = 'none';
  photoPlaceholder.style.display = 'block';
  photoInput.value = '';
  document.getElementById('ata').value = '';
  document.getElementById('area').value = '';
  document.getElementById('subarea').value = '';
  document.getElementById('descripcion').value = '';
  document.getElementById('responsable').value = '';
  descripcionEn.value = '';
  enBox.classList.remove('show');
}

// Nota: el número real de item lo asigna el servidor de forma atómica
// (por si varios usuarios guardan a la vez). Esta es solo una previsualización.
async function fetchNextItemPreview() {
  const label = document.getElementById('nextItemLabel');
  const willBe = document.getElementById('willBeLabel');
  if (APPS_SCRIPT_URL.includes('PEGA_AQUI')) {
    label.textContent = 'sin configurar';
    return;
  }
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=list');
    const data = await res.json();
    if (data.ok) {
      const n = data.items.length;
      const code = 'item ' + String(n).padStart(3, '0');
      label.textContent = 'siguiente: ' + code;
      willBe.textContent = code;
    }
  } catch (err) {
    label.textContent = 'sin conexión';
  }
}

fetchNextItemPreview();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
